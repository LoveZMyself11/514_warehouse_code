<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>院徽加载动画预览</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* 加载动画容器 */
    .logo-loader-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8f4ff 100%);
    }

    .logo-loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* SVG 容器 */
    .logo-loader-svg {
      filter: drop-shadow(0 4px 12px rgba(0, 102, 204, 0.15));
      animation: logoFloat 3s ease-in-out infinite;
    }

    /* 路径描边动画 */
    .logo-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawPath 2s ease-in-out infinite;
    }

    /* 不同路径的延迟 */
    .logo-path-1 { animation-delay: 0s; }
    .logo-path-2 { animation-delay: 0.2s; }
    .logo-path-3 { animation-delay: 0.4s; }
    .logo-path-4 { animation-delay: 0.6s; }
    .logo-path-5 { animation-delay: 0.8s; }

    /* 中心点脉冲 */
    .logo-center-dot {
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* 加载文字 */
    .logo-loader-text {
      font-size: 18px;
      color: #0066CC;
      font-weight: 500;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .logo-loader-dots {
      display: inline-flex;
      gap: 2px;
    }

    .logo-loader-dots span {
      animation: dotBounce 1.4s infinite ease-in-out;
      opacity: 0;
    }

    .logo-loader-dots span:nth-child(1) { animation-delay: 0s; }
    .logo-loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .logo-loader-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ============ 动画定义 ============ */

    @keyframes drawPath {
      0% {
        stroke-dashoffset: 1000;
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      50% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.6;
        transform: scale(1.5);
      }
    }

    @keyframes dotBounce {
      0%, 80%, 100% {
        opacity: 0;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }
  </style>
</head>
<body>
  <div class="logo-loader-container">
    <div class="logo-loader-content">
      <!-- 院徽SVG动画 -->
      <svg
        width="140"
        height="140"
        viewBox="0 0 200 200"
        class="logo-loader-svg"
        xmlns="http://www.w3.org/2000/svg"
      >
        <!-- 外圆环1 -->
        <circle
          cx="100"
          cy="100"
          r="95"
          fill="none"
          stroke="#0066CC"
          stroke-width="3"
          class="logo-path logo-path-1"
        />

        <!-- 外圆环2 -->
        <circle
          cx="100"
          cy="100"
          r="88"
          fill="none"
          stroke="#0066CC"
          stroke-width="2"
          class="logo-path logo-path-2"
        />

        <!-- 内圆环 -->
        <circle
          cx="100"
          cy="100"
          r="68"
          fill="none"
          stroke="#0066CC"
          stroke-width="12"
          class="logo-path logo-path-3"
        />

        <!-- 中心D字母弧形 -->
        <path
          d="M 70 100 Q 70 70, 100 70 Q 130 70, 130 100 Q 130 130, 100 130 Q 70 130, 70 100"
          fill="none"
          stroke="#0066CC"
          stroke-width="8"
          class="logo-path logo-path-4"
        />

        <!-- D字母装饰线 -->
        <path
          d="M 85 85 L 105 95 M 85 115 L 105 105"
          stroke="#00AAFF"
          stroke-width="3"
          stroke-linecap="round"
          class="logo-path logo-path-5"
        />

        <!-- 中心点 -->
        <circle
          cx="100"
          cy="100"
          r="4"
          fill="#0066CC"
          class="logo-center-dot"
        />
      </svg>

      <!-- 加载文字 -->
      <div class="logo-loader-text">
        正在加载
        <span class="logo-loader-dots">
          <span>.</span>
          <span>.</span>
          <span>.</span>
        </span>
      </div>
    </div>
  </div>
</body>
</html>
